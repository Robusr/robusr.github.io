<text x="104.0" y="100.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Fixed gantry, independent C-frame</text>
