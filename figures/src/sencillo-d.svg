<text x="788.0" y="416.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Rivet clearance</text>
