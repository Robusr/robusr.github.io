<text x="1050.0" y="650.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >·</text>
