<text x="1084.0" y="410.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >single servo · large-angle hatch</text>
<rect x="1032.0" y="466.0" width="512.0" height="316.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
