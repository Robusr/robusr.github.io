<text x="1050.0" y="602.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >·</text>
<text x="1066.0" y="602.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Sensor section recovered</text>
<text x="1050.0" y="626.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >·</text>
