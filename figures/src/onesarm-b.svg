<text x="137.0" y="324.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0D29" text-anchor="middle" letter-spacing="0" opacity="1" >FACE</text>
<text x="137.0" y="342.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="middle" letter-spacing="0" opacity="1" >T / N</text>
<rect x="228.0" y="292.0" width="126.0" height="66.0" rx="4" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
