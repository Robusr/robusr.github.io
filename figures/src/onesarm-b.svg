<text x="291.0" y="342.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="middle" letter-spacing="0" opacity="1" >0° / 90°</text>
<rect x="382.0" y="292.0" width="126.0" height="66.0" rx="4" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="445.0" y="324.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0D29" text-anchor="middle" letter-spacing="0" opacity="1" >FACE</text>
<text x="445.0" y="342.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="middle" letter-spacing="0" opacity="1" >T / N</text>
<line x1="200.0" y1="325.0" x2="228.0" y2="325.0" stroke="#0F6B5F" stroke-width="1.5" opacity="1"  marker-end="url(#onesarmbfcfgrammar-ink)" pathLength="1"/>
<line x1="354.0" y1="325.0" x2="382.0" y2="325.0" stroke="#0F6B5F" stroke-width="1.5" opacity="1"  marker-end="url(#onesarmbfcfgrammar-ink)" pathLength="1"/>
<text x="74.0" y="396.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >A long link reports 6 × 4 = 24 raw pairings;</text>
<text x="74.0" y="416.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >18 connection methods are reported.</text>
<text x="74.0" y="446.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >A short link: 4 × 4 = 16 raw; 12 reported.</text>
<text x="74.0" y="476.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >A joint: 2 × 4 = 8 · four Pro, four Con.</text>
<rect x="600.0" y="196.0" width="460.0" height="300.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="618.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >REPORTED COUNTS</text>
<text x="618.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Per module</text>
<text x="618.0" y="292.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >Base</text>
<text x="1000.0" y="292.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#0F6B5F" text-anchor="end" letter-spacing="0" opacity="1" >3</text>
<line x1="618.0" y1="302.0" x2="1042.0" y2="302.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="618.0" y="326.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >Long link</text>
<text x="1000.0" y="326.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#0F6B5F" text-anchor="end" letter-spacing="0" opacity="1" >18</text>
<line x1="618.0" y1="336.0" x2="1042.0" y2="336.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="618.0" y="360.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >Short link</text>
<text x="1000.0" y="360.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#0F6B5F" text-anchor="end" letter-spacing="0" opacity="1" >12</text>
<line x1="618.0" y1="370.0" x2="1042.0" y2="370.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="618.0" y="394.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >Joint</text>
<text x="1000.0" y="394.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#0F6B5F" text-anchor="end" letter-spacing="0" opacity="1" >8</text>
<line x1="618.0" y1="404.0" x2="1042.0" y2="404.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="618.0" y="428.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >End link</text>
<text x="1000.0" y="428.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="600" fill="#0F6B5F" text-anchor="end" letter-spacing="0" opacity="1" >4 or 6</text>
<line x1="618.0" y1="438.0" x2="1042.0" y2="438.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="618.0" y="472.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >These are reported methods, not raw face–channel products.</text>
<rect x="600.0" y="516.0" width="460.0" height="240.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="618.0" y="542.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >CHAIN COUNT</text>
<text x="618.0" y="570.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >N₃ = 3! × 2² = 24</text>
<text x="618.0" y="606.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Three modules; base-adjacent orientation fixed.</text>
<text x="618.0" y="626.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The remaining two choose one of two channels.</text>
<text x="618.0" y="656.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >24 CAD assemblies; AyCxBy-D is analysed.</text>
<text x="618.0" y="686.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The FCF product is larger than the 24 build layouts.</text>
<text x="618.0" y="710.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >24 = 3! × 2², not 3! × 2³.</text>
<rect x="1084.0" y="196.0" width="460.0" height="560.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1102.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >T / N INTERFACE</text>
<text x="1102.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Two perpendicular channels</text>
<rect x="1122.0" y="290.0" width="180.0" height="56.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1212.0" y="322.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0A0D29" text-anchor="middle" letter-spacing="0" opacity="1" >module A</text>
<rect x="1182.0" y="346.0" width="60.0" height="16.0" rx="2" fill="#F5EDE6" stroke="#B26A3C" stroke-width="1" opacity="1" />
<rect x="1196.0" y="362.0" width="32.0" height="18.0" rx="2" fill="#F5EDE6" stroke="#B26A3C" stroke-width="1" opacity="1" />
<text x="1252.0" y="360.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >T tenon</text>
<rect x="1122.0" y="404.0" width="180.0" height="56.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1212.0" y="436.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0A0D29" text-anchor="middle" letter-spacing="0" opacity="1" >module B</text>
<rect x="1182.0" y="388.0" width="60.0" height="16.0" rx="2" fill="#E9F1EE" stroke="#0F6B5F" stroke-width="1" opacity="1" />
<rect x="1196.0" y="404.0" width="32.0" height="18.0" rx="2" fill="#E9F1EE" stroke="#0F6B5F" stroke-width="1" opacity="1" />
<text x="1252.0" y="402.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >N mortise</text>
<line x1="1322.0" y1="330.0" x2="1322.0" y2="380.0" stroke="#0F6B5F" stroke-width="1.4" opacity="1"  marker-end="url(#onesarmbfcfgrammar-ink)" pathLength="1"/>
<text x="1334.0" y="356.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >slide X / Y</text>
<text x="1102.0" y="500.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >M5 clamp; four M3 holes per face.</text>
<text x="1102.0" y="530.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >0° or 90° between modules.</text>
<text x="1102.0" y="560.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Semi-rigid: carries bending, allows small</text>
<text x="1102.0" y="580.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >deformation; the rigid-body model is an</text>
<text x="1102.0" y="600.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >approximation.</text>
<text x="1102.0" y="642.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >Dovetail tenon + half-lap cross joint</text>
<text x="1102.0" y="672.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >as the geometric inspiration.</text>
<text x="1102.0" y="710.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The Pro and Con sides are not interchangeable.</text>
<line x1="56.0" y1="858.0" x2="1544.0" y2="858.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="56.0" y="880.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Source: OnesArm repository README, Figures 6–8; v2 material only.</text>
<text x="1544.0" y="880.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="500" fill="#0F6B5F" text-anchor="end" letter-spacing="0.4" opacity="1" >B · FCF grammar</text>
