<title>OnesArm B — FCF grammar</title>
<defs><marker id="onesarmbfcfgrammar-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0A0D29"/></marker><marker id="onesarmbfcfgrammar-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0F6B5F"/></marker><marker id="onesarmbfcfgrammar-warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#B26A3C"/></marker><marker id="onesarmbfcfgrammar-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6B6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#FBFBF9"/>
<rect x="56.0" y="42.0" width="34.0" height="34.0" rx="3" fill="#0F6B5F" stroke="none" stroke-width="0" opacity="1" />
<text x="73.0" y="66.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#FBFBF9" text-anchor="middle" letter-spacing="0" opacity="1" >B</text>
<text x="106.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.4" opacity="1" >FCF GRAMMAR</text>
<text x="104.0" y="100.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >One interface, three abstractions</text>
<text x="104.0" y="132.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Face–channel–face: a T tenon on top, an N mortise below, two perpendicular channels, one M5 clamp.</text>
<line x1="56.0" y1="158.0" x2="1544.0" y2="158.0" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1544.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B6B6B" text-anchor="end" letter-spacing="0.6" opacity="1" >ONESARM · v2</text>
<rect x="56.0" y="196.0" width="520.0" height="300.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="74.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >FACE — CHANNEL — FACE</text>
<text x="74.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Every connection is an FCF triple</text>
