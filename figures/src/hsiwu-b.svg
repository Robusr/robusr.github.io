<text x="1370.0" y="784.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >low 69 ms</text>
<text x="580.0" y="800.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >0</text>
