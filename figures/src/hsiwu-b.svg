<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="123.75mm" viewBox="0 0 1600 900" role="img">
<title>Hsiwu B — analog control</title>
<defs><marker id="hsiwubanalogcontrol-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0A0D29"/></marker><marker id="hsiwubanalogcontrol-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0F6B5F"/></marker><marker id="hsiwubanalogcontrol-warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#B26A3C"/></marker><marker id="hsiwubanalogcontrol-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6B6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#FBFBF9"/>
<rect x="56.0" y="42.0" width="34.0" height="34.0" rx="3" fill="#0F6B5F" stroke="none" stroke-width="0" opacity="1" />
<text x="73.0" y="66.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#FBFBF9" text-anchor="middle" letter-spacing="0" opacity="1" >B</text>
<text x="106.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.4" opacity="1" >ANALOG CONTROL</text>
<text x="104.0" y="100.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >One 5 V rail, three free-running channels</text>
<text x="104.0" y="132.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The entire control law is three NE555 astables, one 74HC04, and three L293D bridges.</text>
<line x1="56.0" y1="158.0" x2="1544.0" y2="158.0" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1544.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B6B6B" text-anchor="end" letter-spacing="0.6" opacity="1" >HSIWU · rev 1.0</text>
<rect x="56.0" y="196.0" width="430.0" height="620.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="74.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >POWER PATH</text>
<text x="74.0" y="248.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >3.7 V → 5.0 V</text>
<rect x="74.0" y="278.0" width="394.0" height="58.0" rx="4" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="90.0" y="302.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >3.7 V 1S LiPo</text>
<text x="90.0" y="322.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >XH-2A U9 · switch SW2</text>
<rect x="74.0" y="360.0" width="394.0" height="58.0" rx="4" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="90.0" y="384.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >MT3608 boost</text>
<text x="90.0" y="404.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >L1 10 µH · D1 SS34 · C1/C2 22 µF</text>
<rect x="74.0" y="460.0" width="394.0" height="58.0" rx="4" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="90.0" y="484.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >5.0 V rail</text>
<text x="90.0" y="504.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Vout ≈ 4.96 V · LED1 + R6</text>
<line x1="271.0" y1="336.0" x2="271.0" y2="360.0" stroke="#0A0D29" stroke-width="1.6" opacity="1"  marker-end="url(#hsiwubanalogcontrol-ink)" pathLength="1"/>
<line x1="271.0" y1="418.0" x2="271.0" y2="460.0" stroke="#0A0D29" stroke-width="1.6" opacity="1"  marker-end="url(#hsiwubanalogcontrol-ink)" pathLength="1"/>
<text x="74.0" y="548.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >R1 16 kΩ / R2 2.2 kΩ feedback divider</text>
<text x="74.0" y="576.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >No LDO · no reverse-polarity protection</text>
<text x="74.0" y="604.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >D1 is the boost rectifier, not a reverse diode.</text>
<text x="74.0" y="650.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >The same 5 V rail supplies the logic ICs and the motor drivers.</text>
<text x="74.0" y="680.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >3.7 V battery → boost → 5 V → three timers → six motors.</text>
<text x="74.0" y="746.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Schematic: Hsiwu README, Figure 2.</text>
<rect x="516.0" y="196.0" width="500.0" height="318.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="534.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >TIMING</text>
<text x="534.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Three astable channels</text>
<text x="534.0" y="282.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >f = 1.44 / ((R_A + 2 R_B) · C)</text>
<text x="534.0" y="308.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >duty = (R_A + R_B) / (R_A + 2 R_B)</text>
<text x="534.0" y="342.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >R_A ≈ 10 kΩ (100 kΩ trim set near 10 kΩ)</text>
<text x="534.0" y="366.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >R_B = 10 kΩ · C = 10 µF</text>
<text x="534.0" y="398.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >4.8 Hz · 208 ms · 67% duty</text>
<text x="534.0" y="424.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >t_H ≈ 139 ms · t_L ≈ 69 ms</text>
<text x="534.0" y="450.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >trimmer range ≈ 1.2–7.2 Hz</text>
<text x="534.0" y="482.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >Three channels are free-running; there is no hard sync.</text>
<rect x="1046.0" y="196.0" width="498.0" height="330.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1064.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >DRIVE</text>
<text x="1064.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Complementary pairs</text>
<text x="1064.0" y="292.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >CH A</text>
<text x="1112.0" y="292.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >U6 → U5 → U1</text>
<text x="1320.0" y="292.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >M1 / M2</text>
<text x="1064.0" y="344.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >CH B</text>
<text x="1112.0" y="344.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >U7 → U5 → U2</text>
<text x="1320.0" y="344.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >M3 / M4</text>
<text x="1064.0" y="396.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >CH C</text>
<text x="1112.0" y="396.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >U8 → U5 → U3</text>
<text x="1320.0" y="396.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14.5" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >M5 / M6</text>
<text x="1064.0" y="470.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Each L293D uses both H-bridges to drive one mirrored pair.</text>
<text x="1064.0" y="492.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >74HC04 gives /SA, /SB, /SC; the motor reverses every half-cycle.</text>
<text x="1064.0" y="518.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >Unused 74HC04 gates float in revision 1.0.</text>
<rect x="516.0" y="536.0" width="1028.0" height="280.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="534.0" y="562.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >TIMING AND PHASE</text>
<text x="534.0" y="586.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Design point: 4.8 Hz, 208 ms period, 67% duty; phase offsets are illustrative.</text>
<text x="534.0" y="628.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >SA</text>
