<text x="1100.0" y="800.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >416</text>
<text x="1360.0" y="800.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >624 ms</text>
<line x1="56.0" y1="858.0" x2="1544.0" y2="858.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
