<text x="1370.0" y="714.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >low 69 ms</text>
<text x="534.0" y="768.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >SC</text>
<path d="M580.0,746.0 L611.2,746.0 L611.2,776.0 L697.0,776.0 L697.0,746.0 L871.2,746.0 L871.2,776.0 L957.0,776.0 L957.0,746.0 L1131.2,746.0 L1131.2,776.0 L1217.0,776.0 L1217.0,746.0 L1360.0,746.0" fill="none" stroke="#0F6B5F" stroke-width="2" />
