<text x="1370.0" y="644.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >low 69 ms</text>
<text x="534.0" y="698.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >SB</text>
<path d="M580.0,676.0 L697.0,676.0 L697.0,706.0 L782.8,706.0 L782.8,676.0 L957.0,676.0 L957.0,706.0 L1042.8,706.0 L1042.8,676.0 L1217.0,676.0 L1217.0,706.0 L1302.8,706.0 L1302.8,676.0 L1360.0,676.0" fill="none" stroke="#0F6B5F" stroke-width="2" />
