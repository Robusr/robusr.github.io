<text x="106.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.4" opacity="1" >FORCE FLOW</text>
<text x="104.0" y="100.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Two force loops, one frame</text>
<text x="104.0" y="132.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Milling force closes through the fixed gantry; riveting force closes through the independent C-frame; the XY stage only positions.</text>
