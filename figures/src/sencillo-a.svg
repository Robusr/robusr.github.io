<text x="798.0" y="292.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >Milling</text>
<text x="930.0" y="292.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >spindle → fixed gantry → base</text>
<text x="798.0" y="338.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >Riveting</text>
<text x="930.0" y="338.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >head → independent C-frame → base</text>
<text x="798.0" y="384.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Positioning</text>
<text x="930.0" y="384.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >XY stage · no process force</text>
<text x="798.0" y="438.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Large Z forces never pass through the positioning stage.</text>
<text x="798.0" y="462.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The fixed gantry and the C-frame can be optimised separately.</text>
