<text x="798.0" y="570.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >8/8 mil · 0.8 mm via · ≤ 30 min</text>
