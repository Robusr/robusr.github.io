<text x="74.0" y="660.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >The XY stage moves the work; it does not carry the process force.</text>
<text x="74.0" y="690.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The two loops close independently through the base.</text>
<text x="74.0" y="720.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >Design target; no measured machine exists yet.</text>
<rect x="780.0" y="196.0" width="764.0" height="300.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
