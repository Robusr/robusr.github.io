<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220mm" height="123.75mm" viewBox="0 0 1600 900" role="img">
<title>Hsiwu C — wing drive</title>
<defs><marker id="hsiwucwingdrive-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0A0D29"/></marker><marker id="hsiwucwingdrive-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#0F6B5F"/></marker><marker id="hsiwucwingdrive-warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#B26A3C"/></marker><marker id="hsiwucwingdrive-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#6B6B6B"/></marker></defs>
<rect width="1600" height="900" fill="#FBFBF9"/>
<rect x="56.0" y="42.0" width="34.0" height="34.0" rx="3" fill="#0F6B5F" stroke="none" stroke-width="0" opacity="1" />
<text x="73.0" y="66.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#FBFBF9" text-anchor="middle" letter-spacing="0" opacity="1" >C</text>
<text x="106.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.4" opacity="1" >WING DRIVE</text>
<text x="104.0" y="100.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Lead screw, not a crank-rocker</text>
<text x="104.0" y="132.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The reference four-bar is a benchmark; the as-built segment drive is a lead screw, a traveling nut, and the same H-bridge reversal.</text>
<line x1="56.0" y1="158.0" x2="1544.0" y2="158.0" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1544.0" y="58.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" fill="#6B6B6B" text-anchor="end" letter-spacing="0.6" opacity="1" >HSIWU · rev 1.0</text>
<rect x="56.0" y="196.0" width="952.0" height="586.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="74.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >AS-BUILT MECHANISM · CAD ANIMATION</text>
<text x="74.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >One motor per segment; six in total</text>
<rect x="80.0" y="270.0" width="900.0" height="470.0" rx="3" fill="#0E1118" stroke="none" stroke-width="0" opacity="1" />
<rect x="80.0" y="270.0" width="900.0" height="470.0" rx="3" fill="none" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="74.0" y="760.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Motor → lead screw P = 0.4 mm → nut → segment linkage; H-bridge reverses every half-cycle.</text>
<rect x="1032.0" y="196.0" width="512.0" height="166.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1050.0" y="222.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >REFERENCE</text>
<text x="1050.0" y="250.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Crank-rocker (Qi &amp; Zhang)</text>
<text x="1050.0" y="282.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >The reference paper's four-bar</text>
<text x="1050.0" y="304.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >is a kinematic benchmark,</text>
<text x="1050.0" y="326.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >not the as-built linkage.</text>
<circle cx="1320" cy="300" r="12" fill="none" stroke="#B26A3C" stroke-width="2"/>
<line x1="1332" y1="300" x2="1406" y2="270" stroke="#B26A3C" stroke-width="2"/>
<line x1="1406" y1="270" x2="1432" y2="334" stroke="#0A0D29" stroke-width="1.8"/>
<circle cx="1432" cy="334" r="3" fill="#0A0D29"/>
<circle cx="1320" cy="300" r="3" fill="#0A0D29"/>
<text x="1308.0" y="334.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >crank</text>
<text x="1374.0" y="256.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >coupler</text>
<text x="1440.0" y="316.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >rocker</text>
<rect x="1032.0" y="382.0" width="512.0" height="196.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1050.0" y="408.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >AS-BUILT</text>
<text x="1050.0" y="436.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >Motor → screw → nut</text>
<rect x="1050.0" y="458.0" width="78.0" height="36.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1089.0" y="481.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#161616" text-anchor="middle" letter-spacing="0" opacity="1" >motor</text>
<rect x="1140.0" y="458.0" width="78.0" height="36.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1179.0" y="481.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#161616" text-anchor="middle" letter-spacing="0" opacity="1" >lead screw</text>
<rect x="1260.0" y="458.0" width="78.0" height="36.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1299.0" y="481.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#161616" text-anchor="middle" letter-spacing="0" opacity="1" >nut</text>
<rect x="1350.0" y="458.0" width="78.0" height="36.0" rx="3" fill="#FBFBF9" stroke="#D8D8D1" stroke-width="1" opacity="1" />
<text x="1389.0" y="481.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="500" fill="#161616" text-anchor="middle" letter-spacing="0" opacity="1" >linkage</text>
<line x1="1128.0" y1="476.0" x2="1140.0" y2="476.0" stroke="#0A0D29" stroke-width="1.3" opacity="1"  marker-end="url(#hsiwucwingdrive-ink)" pathLength="1"/>
<line x1="1218.0" y1="476.0" x2="1260.0" y2="476.0" stroke="#0A0D29" stroke-width="1.3" opacity="1"  marker-end="url(#hsiwucwingdrive-ink)" pathLength="1"/>
<line x1="1338.0" y1="476.0" x2="1350.0" y2="476.0" stroke="#0A0D29" stroke-width="1.3" opacity="1"  marker-end="url(#hsiwucwingdrive-ink)" pathLength="1"/>
<text x="1050.0" y="526.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >P = 0.4 mm · H-bridge reversal each half-cycle</text>
<text x="1050.0" y="550.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >3 segments per wing: L · M · T</text>
<rect x="1032.0" y="598.0" width="512.0" height="184.0" rx="5" fill="#FFFFFF" stroke="#D8D8D1" stroke-width="1.2" opacity="1" />
<text x="1050.0" y="624.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="1.2" opacity="1" >SEGMENT MAP</text>
<text x="1050.0" y="652.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#0A0D29" text-anchor="start" letter-spacing="0" opacity="1" >One motor per segment</text>
<text x="1050.0" y="684.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >L</text>
<text x="1078.0" y="684.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >M1 / M2  ·  CH A</text>
<text x="1050.0" y="714.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >M</text>
<text x="1078.0" y="714.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >M3 / M4  ·  CH B</text>
<text x="1050.0" y="744.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#0F6B5F" text-anchor="start" letter-spacing="0" opacity="1" >T</text>
<text x="1078.0" y="744.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#161616" text-anchor="start" letter-spacing="0" opacity="1" >M5 / M6  ·  CH C</text>
<text x="1050.0" y="776.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="500" fill="#B26A3C" text-anchor="start" letter-spacing="0" opacity="1" >70° stroke is a reference target, not measured.</text>
<line x1="56.0" y1="858.0" x2="1544.0" y2="858.0" stroke="#E8E8E2" stroke-width="1" opacity="1" />
<text x="56.0" y="880.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="400" fill="#6B6B6B" text-anchor="start" letter-spacing="0" opacity="1" >Source: Hsiwu repository README, Figure 5; CAD animation from the repository.</text>
<text x="1544.0" y="880.0" font-family="Inter, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="500" fill="#0F6B5F" text-anchor="end" letter-spacing="0.4" opacity="1" >C · wing drive</text>
